# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which is larger than
# this machine's entire physical RAM (7.9 GiB, ~1.6 GiB free at idle). Windows
# backs the committed memory by growing C:\pagefile.sys, so the disk fills up
# mid-build. That surfaces as "Failed to create Jar file" during dependency
# instrumentation -- an IOException, not an OOM -- and is easy to misread as a
# corrupted Gradle cache. Keep the daemon footprint inside the machine.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
